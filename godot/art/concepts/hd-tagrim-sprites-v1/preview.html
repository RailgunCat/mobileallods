<!doctype html><html lang="ru"><meta charset="utf-8"><title>Тагрим083–088: HD-тест</title><style>body{background:#151b19;color:#dedfce;font:16px system-ui;margin:24px}a{color:#9ccc9a}button,select,input{font:inherit;margin:6px;padding:7px}main{display:flex;gap:20px;flex-wrap:wrap}canvas{width:400px;height:400px;border:1px solid #71816a;max-width:90vw}label{display:inline-block}small{display:block;max-width:900px}figure{margin:0}footer{margin-block:18px;max-width:900px}</style><h1>Тагрим083–088 · тестовые HD-спрайты</h1><p><a href="README.md">Описание и ограничения</a> · <a href="manifest.json">Измерения</a></p><select id="clip"></select><button id="play">Пауза</button><button id="step">Следующий кадр</button><input type="range" id="frame" min="0" max="3" value="0"><br><select id="background"><option value="check">Прозрачность</option><option value="dark">Тёмный</option><option value="light">Светлый</option><option value="grass">Трава</option></select><label><input type="checkbox" id="mirror">Зеркало</label><label><input type="checkbox" id="normalize">Выравнивать bbox (только превью)</label><p id="state"></p><main><figure><figcaption>Оригинал, исходные рамки/якорь, ×4</figcaption><canvas id="original" width="400" height="400"></canvas></figure><figure><figcaption>HD, тестовая нарезка и приблизительный якорь</figcaption><canvas id="hd" width="400" height="400"></canvas></figure></main><footer>Это локальный просмотрщик артов. Bbox включает меч/плащ и не является положением стопы. Нарезка, масштаб, цикл и привязки ещё не утверждены. Исходные PNG не исправляются этим просмотрщиком. В игру ничего не подключено.</footer><script src="preview.js"></script></html>
